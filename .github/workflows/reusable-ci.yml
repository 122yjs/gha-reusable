name: Reusable CI

on:
  workflow_call:
    inputs:
      run_graphify:
        description: "Run code-only Graphify and upload graph.json artifact"
        type: boolean
        default: true
      run_pr_conflicts:
        description: "On pull_request, run graphify prs --conflicts (community overlap)"
        type: boolean
        default: true
      node_version:
        type: string
        default: "22"
      python_version:
        type: string
        default: "3.12"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect stack
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          has_node=false
          has_py=false
          if [[ -f package.json ]]; then has_node=true; fi
          if [[ -f pyproject.toml || -f requirements.txt || -f setup.py ]]; then has_py=true; fi
          echo "node=$has_node" >> "$GITHUB_OUTPUT"
          echo "python=$has_py" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.stack.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || hashFiles('yarn.lock') != '' && 'yarn' || hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install & test (Node)
        if: steps.stack.outputs.node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile || pnpm install
            pnpm test --if-present
            pnpm run lint --if-present || true
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --frozen-lockfile || yarn install
            yarn test --if-present || true
          else
            npm ci || npm install
            npm test --if-present
            npm run lint --if-present || true
          fi

      - name: Setup Python
        if: steps.stack.outputs.python == 'true' || inputs.run_graphify
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install & test (Python)
        if: steps.stack.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          if [[ -f pyproject.toml ]]; then pip install -e ".[dev]" || pip install -e . || true; fi
          if command -v pytest >/dev/null; then pytest -q; else echo "pytest not installed; skip"; fi

      - name: Graphify (code-only)
        id: graphify
        if: inputs.run_graphify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip graphifyy
          graphify . --code-only || graphify extract . --code-only || graphify update . --no-cluster || true
          if [[ -f graphify-out/graph.json ]]; then
            echo "has_graph=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_graph=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la graphify-out || true

      - name: Upload graphify artifact
        if: inputs.run_graphify
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: ignore

      - name: Graphify PR community conflicts
        if: >-
          inputs.run_graphify &&
          inputs.run_pr_conflicts &&
          github.event_name == 'pull_request' &&
          steps.graphify.outputs.has_graph == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.base_ref || 'main' }}"

          # A community-overlap comparison needs at least two open PRs targeting
          # the same base. Avoid Graphify's statusCheckRollup query when there is
          # nothing to compare; this also keeps single-PR CI compatible with the
          # repository-scoped GitHub Actions token.
          open_pr_count="$(gh api "repos/${GH_REPO}/pulls?state=open&base=${base}&per_page=2" --jq 'length')"
          if [ "$open_pr_count" -le 1 ]; then
            {
              echo "## Graphify PR community conflicts"
              echo ""
              printf 'Base: `%s`\n\n' "$base"
              echo "No other open PR targets this base; no community overlap is possible."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python -m pip install -U pip graphifyy
          out="$(mktemp)"
          set +e
          graphify prs --conflicts --base "$base" --repo "$GH_REPO" | tee "$out"
          code=$?
          set -e

          {
            echo "## Graphify PR community conflicts"
            echo ""
            printf 'Base: `%s`\n\n' "$base"
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # PR 코멘트 (실패해도 검사는 계속)
          if command -v gh >/dev/null; then
            body_file="$(mktemp)"
            {
              echo "### Graphify community overlap (\`prs --conflicts\`)"
              echo ""
              echo "Checks whether open PRs touch the same graph communities (merge-order risk), not git line conflicts."
              echo ""
              echo '```'
              cat "$out"
              echo '```'
            } > "$body_file"
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body_file" || true
          fi

          if grep -q "Community conflicts (PRs sharing the same graph community)" "$out"; then
            echo "::error::Open PRs share graph communities — review merge order before landing both."
            exit 1
          fi
          exit "$code"
